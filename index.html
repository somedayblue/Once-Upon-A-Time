<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>작은 집, 먼 모험</title><style>
*{box-sizing:border-box}body{margin:0;background:#161c29;color:#f7e8c8;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer}#app{max-width:510px;margin:auto;min-height:100dvh;background:#283347;box-shadow:0 0 35px #070a11}header{background:#1a2635;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #98734c}header b{color:#ffe1a0}nav{display:flex;background:#192533;position:sticky;bottom:0;z-index:10;border-top:3px solid #856747}nav button{flex:1;background:transparent;border:0;color:#d3c2a6;padding:13px 3px;font-size:13px}nav button.active{background:#52624c;color:#fff4c8}.screen{padding:14px;min-height:calc(100dvh - 110px)}h2{margin:7px 0 10px;font-size:22px;color:#ffe4ac}.muted{color:#c9c5ba;font-size:13px;line-height:1.6}.panel{background:#354459;border:2px solid #9b7956;box-shadow:inset 0 0 0 2px #263144;padding:12px;margin:10px 0;border-radius:4px}.btn{background:#b47a48;border:2px solid #e1b775;color:#fff7dc;border-radius:3px;padding:10px 12px;margin:4px 2px;font-weight:700}.btn:disabled{opacity:.4}.btn.secondary{background:#566b66;border-color:#91a48e}.btn.small{font-size:12px;padding:7px 8px}.flex{display:flex;gap:7px;flex-wrap:wrap}.tilegrid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:10px auto;max-width:420px;touch-action:manipulation}.tile{aspect-ratio:1;border:3px solid #263449;display:grid;place-items:center;position:relative;border-radius:5px;box-shadow:inset -4px -4px #0003, inset 3px 3px #fff4;font-size:clamp(19px,7vw,32px);font-weight:900;color:#fff;text-shadow:2px 2px #0007;user-select:none}.tile.selected{outline:3px solid #fff1a0;outline-offset:-3px}.tile.block:after{content:'✦';position:absolute;right:1px;bottom:0;font-size:13px;color:#ffe5ad}.status{display:flex;justify-content:space-around;background:#1b2c3c;padding:10px 2px;border-radius:5px}.status div{text-align:center}.status b{display:block;color:#ffe2a0;font-size:20px}.pixel{width:100%;height:auto;image-rendering:pixelated;display:block;border:3px solid #bd9865;background:#324a4d}.card{display:flex;align-items:center;gap:10px;padding:9px;background:#26384b;border:2px solid #72806b;margin:7px 0}.portrait{font-size:30px;width:54px;height:54px;display:grid;place-items:center;background:#536b65;border:2px solid #c0a071}.card.sel{border-color:#f8d87d;background:#48574d}.story{line-height:1.8;font-size:15px}.notice{background:#243a37;border-left:4px solid #b9cd8b;padding:10px;margin:10px 0}.decor{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.decor button{padding:12px 7px;background:#3a4d5b;border:2px solid #b19165;color:#fff0d3}.decor button:disabled{opacity:.5}.hidden{display:none}.footerhint{font-size:12px;color:#d7c5a7;text-align:center;padding:6px}#toast{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);background:#171f2e;border:2px solid #e7b879;padding:11px 16px;max-width:90vw;z-index:99;display:none;text-align:center}#toast.show{display:block}
</style></head><body><div id="app"><header><b>✦ 작은 집, 먼 모험</b><span>🪙 <span id="coins">0</span>　⭐ <span id="stars">0</span></span></header><main id="screen" class="screen"></main><nav><button data-tab="home">⌂ 집</button><button data-tab="adventure">⚔ 모험</button><button data-tab="friends">♟ 동료</button><button data-tab="journal">▤ 일지</button></nav></div><div id="toast"></div><script>
const $=s=>document.querySelector(s);const colors=['#da7959','#65a4c9','#81a66d','#c4a257','#a87bb9'];const symbols=['◆','●','✿','★','⬟'];const names=['붉은 보석','물방울','잎사귀','별빛','달빛'];const defaultState=()=>({coins:30,stars:0,stage:0,chapter:0,companion:'lila',pet:'fox',decor:['bed'],flags:{},log:['낡은 집의 열쇠를 받았다.'],won:0});let s;try{s=Object.assign(defaultState(),JSON.parse(localStorage.getItem('littlehouse_demo_v2')||'null')||{})}catch{s=defaultState()}let tab='home',board=[],moves=0,goals={},selected=-1,locked=false,scene='start',boost=0,blockers=[],puzzleActive=false;const stages=[{title:'숲의 잃어버린 길',intro:'숲길을 막은 덩굴을 치우고 빛나는 조각을 모아야 합니다.',move:16,goal:[10,8],types:[2,3],block:4},{title:'비밀의 샘',intro:'샘 주변에 쌓인 얼음과 돌을 치워야 합니다.',move:16,goal:[10,8],types:[1,4],block:5},{title:'잊힌 유적',intro:'오래된 장치를 움직일 수정이 필요합니다.',move:18,goal:[12,10],types:[0,3],block:6},{title:'돌아오는 길',intro:'집으로 돌아가기 전, 숲의 마지막 봉인을 풀어야 합니다.',move:18,goal:[12,10],types:[2,4],block:6}];const people={lila:{name:'릴라',emoji:'🧙🏻‍♀️',role:'학자',skill:'한 번에 원하는 타일 하나 제거',text:'잊힌 유적에 남겨진 기록을 찾고 싶어 합니다.'},edan:{name:'에단',emoji:'🛡️',role:'기사',skill:'퍼즐 시작 시 장애물 2개 제거',text:'고향으로 돌아가는 길을 찾고 있습니다.'},sera:{name:'세라',emoji:'🗝️',role:'여행자',skill:'퍼즐당 이동 횟수 2회 추가',text:'사라진 교역로를 찾아 여행 중입니다.'}};const decorations={bed:{name:'낡은 침대',cost:0,emoji:'🛏️'},plant:{name:'초록 화분',cost:25,emoji:'🪴'},rug:{name:'포근한 양탄자',cost:35,emoji:'🧶'},books:{name:'책장',cost:50,emoji:'📚'},fire:{name:'벽난로',cost:70,emoji:'🔥'},lamp:{name:'작은 등불',cost:20,emoji:'🏮'}};function save(){try{localStorage.setItem('littlehouse_demo_v2',JSON.stringify(s))}catch(err){}$('#coins').textContent=s.coins;$('#stars').textContent=s.stars}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2200)}function nav(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}function show(t){tab=t;nav();render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.tab));function canvas(){let c=document.createElement('canvas');c.width=256;c.height=174;c.className='pixel';return c}function rect(g,x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function drawHome(){let c=canvas(),g=c.getContext('2d');g.imageSmoothingEnabled=false;rect(g,0,0,256,174,'#5d6d70');rect(g,0,108,256,66,'#8d6b4b');for(let i=0;i<256;i+=32){rect(g,i,109,1,65,'#70533e');rect(g,0,128,256,1,'#70533e');rect(g,0,151,256,1,'#70533e')}rect(g,10,12,62,70,'#473d39');rect(g,14,16,54,62,'#91b7bc');rect(g,40,16,3,62,'#c5a16a');rect(g,14,46,54,3,'#c5a16a');rect(g,16,62,50,14,'#5d8d6d');rect(g,13,9,56,8,'#a77b55');rect(g,78,65,76,49,'#74543e');rect(g,83,59,65,8,'#a5825e');rect(g,88,69,54,40,'#b8a188');rect(g,93,75,45,24,'#e2d1a6');rect(g,110,85,32,15,'#7d9e77');rect(g,177,30,56,76,'#5b4638');rect(g,181,35,48,5,'#bca070');for(let i=0;i<4;i++){rect(g,183+i*11,43,7,25,['#b67a5e','#7793a1','#9f9b64','#a67c9a'][i])}rect(g,181,73,48,5,'#bca070');rect(g,183,81,11,18,'#b47d60');rect(g,200,81,10,18,'#9b9c7d');rect(g,216,81,9,18,'#76939a');rect(g,156,116,51,28,'#b88a5a');rect(g,161,112,42,7,'#cfa977');rect(g,173,123,14,9,'#e4d4b2');rect(g,179,125,3,3,'#674c3d');if(s.decor.includes('rug')){rect(g,62,141,126,23,'#9c6b6e');rect(g,67,145,116,15,'#cfab8e')}if(s.decor.includes('plant')){rect(g,27,113,18,14,'#a66d47');for(let i=0;i<9;i++)rect(g,28+(i*7)%18,96+(i*5)%17,6,6,'#68936a')}if(s.decor.includes('fire')){rect(g,210,113,39,41,'#53423d');rect(g,215,118,29,31,'#1d2b2e');rect(g,224,125,13,20,'#e9a74f');rect(g,228,118,7,24,'#f4d079')}if(s.decor.includes('lamp')){rect(g,163,9,4,27,'#e3bc76');rect(g,152,32,26,18,'#e9b45d');rect(g,157,37,16,8,'#ffe3a0')}if(s.decor.includes('books')){rect(g,5,88,44,7,'#bc9867');for(let i=0;i<6;i++)rect(g,8+i*6,75,4,13,['#ae746a','#7d9c8a','#c5a05e'][i%3])} // player
rect(g,114,114,13,17,'#414b68');rect(g,116,103,10,12,'#e5b992');rect(g,113,99,16,6,'#654a39');rect(g,116,131,5,7,'#3b3844');rect(g,123,131,5,7,'#3b3844'); // fox
if(s.pet==='fox'){rect(g,49,126,18,11,'#c9814c');rect(g,47,122,6,8,'#c9814c');rect(g,63,121,7,11,'#c9814c');rect(g,51,121,5,3,'#e8caa0');rect(g,62,121,5,3,'#e8caa0');rect(g,67,130,10,5,'#e5c9a5')}else{rect(g,49,123,17,15,'#353640');rect(g,48,118,6,7,'#353640');rect(g,61,118,6,7,'#353640');rect(g,53,128,2,2,'#f4d78a');rect(g,62,128,2,2,'#f4d78a')}return c}function home(){let e=$('#screen');e.innerHTML='<h2>⌂ 나의 작은 집</h2><p class="muted">모험에서 가져온 물건들로 집을 꾸며 보세요.</p><div id="homeart"></div><div class="panel"><b>집 꾸미기</b><p class="muted">가구를 구입하면 집에 바로 배치됩니다. 집은 모험의 기록이 됩니다.</p><div class="decor" id="decor"></div></div><div class="panel"><b>함께 사는 펫</b><div class="flex"><button class="btn small" id="fox">🦊 여우</button><button class="btn small secondary" id="cat">🐈 고양이</button></div><p class="muted">펫은 집에서 함께 생활합니다. 데모에서는 외형을 바꿀 수 있습니다.</p></div><div class="panel"><b>♪ 로파이 공간</b><p class="muted">유저가 원할 때만 들어가는 감상 모드입니다. 데모에서는 조용한 방 화면을 보여줍니다. 음악 파일은 포함하지 않았습니다.</p><button class="btn secondary" id="lofi">로파이 모드 열기</button></div>';$('#homeart').append(drawHome());let d=$('#decor');Object.entries(decorations).filter(([k])=>k!=='bed').forEach(([k,v])=>{let b=document.createElement('button');b.textContent=`${v.emoji} ${v.name} · ${s.decor.includes(k)?'배치됨':v.cost+'코인'}`;b.disabled=s.decor.includes(k)||s.coins<v.cost;b.onclick=()=>{s.coins-=v.cost;s.decor.push(k);s.log.unshift(v.name+'을(를) 집에 배치했다.');save();home();toast('집이 조금 더 아늑해졌어요!')};d.append(b)});$('#fox').onclick=()=>{s.pet='fox';save();home()};$('#cat').onclick=()=>{s.pet='cat';save();home()};$('#lofi').onclick=()=>{let e=$('#screen');e.innerHTML='<h2>♪ 조용한 오후</h2><p class="muted">모험과 별도로 선택해 들어온 휴식 공간입니다.</p><div id="quiet"></div><div class="panel">창밖에 바람이 불고, 펫이 낮잠을 잡니다.<p class="muted">실제 로파이 음원은 라이선스가 확보되면 추가할 수 있습니다.</p><button class="btn" id="backhome">집으로 돌아가기</button></div>';$('#quiet').append(drawHome());$('#backhome').onclick=home}}function friends(){let e=$('#screen');e.innerHTML='<h2>♟ 함께 걷는 사람들</h2><p class="muted">동료는 각자의 목적이 있습니다. 한 번의 모험에 한 명만 동행합니다.</p>';Object.entries(people).forEach(([id,p])=>{let el=document.createElement('div');el.className='card'+(s.companion===id?' sel':'');el.innerHTML=`<div class="portrait">${p.emoji}</div><div style="flex:1"><b>${p.name} · ${p.role}</b><div class="muted">${p.text}</div><div style="font-size:12px;color:#ffe0a2">✦ ${p.skill}</div></div><button class="btn small">${s.companion===id?'동행 중':'동행'}</button>`;el.querySelector('button').onclick=()=>{s.companion=id;save();friends();toast(p.name+'와(과) 동행합니다.')};e.append(el)})}function adventure(){if(puzzleActive){puzzleUI();return}let st=stages[s.stage%stages.length];let e=$('#screen');e.innerHTML=`<h2>⚔ 숲 너머의 이야기</h2><div class="panel story"><b>제${s.stage+1}장 · ${st.title}</b><p>${s.stage===0?'어느 날, 숲에서 돌아오지 않은 약초꾼을 찾는 의뢰가 도착했습니다. 집을 꾸밀 돈도 필요하지만, 숲에는 오래된 비밀이 있다는 소문이 돕니다.':st.intro}</p><p>동행: <b>${people[s.companion].name}</b> · 펫: ${s.pet==='fox'?'여우':'고양이'}</p></div><div class="panel"><b>어떻게 할까요?</b><div id="choices"></div></div>`;let choices=[['숲길을 따라 정면으로 조사한다','정면에서 덩굴을 헤치며 탐색합니다.'],['주변을 살펴 우회로를 찾는다','숲을 돌아가며 다른 단서를 찾습니다.']];if(s.companion==='lila')choices.push(['릴라에게 고문서를 살펴보게 한다','릴라가 숨겨진 봉인에 관한 기록을 발견합니다.']);if(s.companion==='edan')choices.push(['에단에게 안전한 길을 찾게 한다','에단이 위험한 장애물을 미리 정리합니다.']);if(s.companion==='sera')choices.push(['세라의 길 안내를 따른다','세라가 이동하기 좋은 길을 발견합니다.']);choices.forEach(([title,desc],i)=>{let b=document.createElement('button');b.className='btn secondary';b.style='display:block;width:100%;text-align:left;margin:8px 0';b.textContent=title;b.onclick=()=>{s.flags['choice'+s.stage]=title;s.log.unshift('제'+(s.stage+1)+'장: '+title);save();startPuzzle(i);toast(desc)};$('#choices').append(b)})}function fill(){return Math.floor(Math.random()*5)}function hasMatch(b){for(let y=0;y<6;y++)for(let x=0;x<6;x++){let i=y*6+x,v=b[i];if(x<4&&b[i+1]===v&&b[i+2]===v)return true;if(y<4&&b[i+6]===v&&b[i+12]===v)return true}return false}function startPuzzle(choice){let st=stages[s.stage%stages.length];board=Array.from({length:36},fill);for(let k=0;k<100&&hasMatch(board);k++){for(let i=0;i<36;i++)if(Math.random()<.3)board[i]=fill()}moves=st.move+(s.companion==='sera'?2:0);goals={};st.types.forEach((v,i)=>goals[v]=st.goal[i]);selected=-1;locked=false;boost=s.companion==='lila'?1:0;blockers=Array(36).fill(false);let count=st.block-(s.companion==='edan'?2:0);let indices=Array.from({length:36},(_,i)=>i).sort(()=>Math.random()-.5);indices.slice(0,count).forEach(i=>blockers[i]=true);puzzleActive=true;puzzleUI()}function getMatches(){let set=new Set();for(let y=0;y<6;y++){let x=0;while(x<6){let j=x+1;while(j<6&&board[y*6+j]===board[y*6+x])j++;if(j-x>=3)for(let k=x;k<j;k++)set.add(y*6+k);x=j}}for(let x=0;x<6;x++){let y=0;while(y<6){let j=y+1;while(j<6&&board[j*6+x]===board[y*6+x])j++;if(j-y>=3)for(let k=y;k<j;k++)set.add(k*6+x);y=j}}return [...set]}function resolve(){let total=0,chain=0;while(chain<25){let matches=getMatches();if(!matches.length)break;chain++;total+=matches.length;for(let i of matches){let v=board[i];if(goals[v]>0)goals[v]--;if(blockers[i])blockers[i]=false;board[i]=-1}for(let x=0;x<6;x++){let col=[];for(let y=5;y>=0;y--)if(board[y*6+x]!==-1)col.push(board[y*6+x]);while(col.length<6)col.push(fill());for(let y=5;y>=0;y--)board[y*6+x]=col[5-y]}}if(total)toast(`${total}개 제거! ${chain>1?'연쇄 '+chain+'회!':''}`);if(Object.values(goals).every(v=>v<=0)&&blockers.every(v=>!v)){win();return}if(moves<=0){puzzleActive=false;toast('이동 횟수가 부족합니다. 다시 도전하세요.');adventure();return}puzzleUI()}function swap(i,j){[board[i],board[j]]=[board[j],board[i]]}function tap(i){if(locked)return;if(boost&&selected===-1){selected=i;puzzleUI();return}if(selected===-1){selected=i;puzzleUI();return}if(selected===i){if(boost){let v=board[i];if(goals[v]>0)goals[v]--;if(blockers[i])blockers[i]=false;board[i]=fill();boost=0;selected=-1;resolve();return}selected=-1;puzzleUI();return}let a=selected;selected=-1;if(Math.abs(Math.floor(a/6)-Math.floor(i/6))+Math.abs(a%6-i%6)!==1){selected=i;puzzleUI();return}swap(a,i);if(!getMatches().length){swap(a,i);toast('3개 이상 맞춰야 합니다.');puzzleUI();return}moves--;resolve()}function puzzleUI(){let st=stages[s.stage%stages.length],e=$('#screen');e.innerHTML=`<h2>✦ ${st.title}</h2><p class="muted">인접한 타일 두 개를 눌러 교환하세요. 같은 모양 3개 이상을 맞추면 제거됩니다.</p><div class="status"><div>남은 이동<b>${moves}</b></div>${st.types.map(v=>`<div>${symbols[v]} 수집<b>${Math.max(0,goals[v])}</b></div>`).join('')}<div>장애물<b>${blockers.filter(Boolean).length}</b></div></div><div class="tilegrid" id="board"></div><div class="panel"><b>${people[s.companion].emoji} ${people[s.companion].name}의 도움</b><p class="muted">${people[s.companion].skill}</p><div id="ability"></div></div><button class="btn secondary" id="leave">모험에서 나가기</button>`;board.forEach((v,i)=>{let b=document.createElement('button');b.className='tile'+(selected===i?' selected':'')+(blockers[i]?' block':'');b.style.background=colors[v];b.textContent=symbols[v];b.setAttribute('aria-label',names[v]+(blockers[i]?' 장애물':''));b.onclick=()=>tap(i);$('#board').append(b)});if(s.companion==='lila'&&boost){let b=document.createElement('button');b.className='btn small';b.textContent='✦ 릴라의 마법 사용 (타일 선택 후 다시 누르기)';b.onclick=()=>toast('제거할 타일을 두 번 눌러주세요.');$('#ability').append(b)}else if(s.companion==='lila')$('#ability').textContent='마법을 사용했습니다.';else $('#ability').textContent='동료 효과가 적용되었습니다.';$('#leave').onclick=()=>{puzzleActive=false;adventure()}}function win(){puzzleActive=false;s.won++;s.stage++;s.coins+=25;s.stars+=1;let reward=['숲의 작은 지도','샘의 빛나는 조각','유적의 낡은 기록','약초꾼의 감사 편지'][(s.stage-1)%4];s.log.unshift('모험 성공! '+reward+' 획득.');save();let e=$('#screen');e.innerHTML=`<h2>✦ 모험 성공!</h2><div class="panel story"><p>숲의 길을 열고 무사히 집으로 돌아왔습니다. <b>${people[s.companion].name}</b>도 이번 여행을 기억할 것입니다.</p><p>🎁 발견한 물건: <b>${reward}</b></p><p>🪙 +25코인　⭐ +1별</p><p class="muted">집을 꾸미거나 다음 이야기로 진행할 수 있습니다.</p></div><button class="btn" id="tohome">집으로 돌아가기</button><button class="btn secondary" id="next">다음 모험</button>`;$('#tohome').onclick=()=>show('home');$('#next').onclick=adventure}function journal(){let e=$('#screen');e.innerHTML='<h2>▤ 나의 모험 일지</h2><p class="muted">선택과 보상이 여기에 남습니다. 진행 상황은 기기에 자동 저장됩니다.</p><div class="panel" id="logs"></div><button class="btn secondary" id="reset">처음부터 다시 시작</button>';$('#logs').innerHTML=s.log.map((l,i)=>`<p style="border-bottom:1px solid #ffffff22;padding-bottom:7px">${i+1}. ${l}</p>`).join('');$('#reset').onclick=()=>{if(confirm('모든 진행 상황을 지우고 다시 시작할까요?')){s=defaultState();puzzleActive=false;save();show('home')}}}function render(){save();if(tab==='home')home();if(tab==='friends')friends();if(tab==='adventure')adventure();if(tab==='journal')journal()}render();
</script></body></html>
