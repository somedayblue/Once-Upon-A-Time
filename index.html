<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#182b35"><title>작은 집, 먼 모험 · 픽셀 데모</title><style>
*{box-sizing:border-box}body{margin:0;background:#101d25;color:#f9e9c6;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;touch-action:manipulation}#app{max-width:540px;margin:auto;min-height:100dvh;background:#213541;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#152934;border-bottom:3px solid #84674d}header b{font-size:16px}header span{font-size:13px;color:#f8d992}main{flex:1;padding:12px 12px 92px}.pixel{image-rendering:pixelated;image-rendering:crisp-edges;width:100%;display:block;border:4px solid #0e1b23;background:#182b35}.panel{background:#2b4350;border:2px solid #58717b;box-shadow:inset 0 0 0 2px #213440;padding:12px;margin-top:10px}.eyebrow{font-size:11px;color:#d7b779;letter-spacing:2px;font-weight:800}.title{font-size:20px;font-weight:900;margin:5px 0}.muted{color:#c3d1c9;font-size:13px;line-height:1.6}.btn{background:#e5b76c;border:0;border-bottom:4px solid #946942;color:#263139;padding:11px 14px;font-weight:900;cursor:pointer;min-height:44px}.btn:active{transform:translateY(2px)}.btn.secondary{background:#476879;color:#fff0cd;border-color:#253f4e}.btn:disabled{opacity:.5}.actions{display:flex;gap:8px;margin-top:12px}.actions>*{flex:1}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,540px);display:flex;background:#132833;border-top:3px solid #84674d;padding-bottom:env(safe-area-inset-bottom)}.tabs button{flex:1;background:transparent;border:0;color:#c0cfca;padding:11px 1px;font-size:12px}.tabs button.active{color:#ffdb88;background:#2b4652}.tabs strong{display:block;font-size:18px;margin-bottom:3px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.chip{background:#19323e;border:1px solid #69808a;padding:6px 9px;font-size:12px}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;background:#122936;padding:5px;border:3px solid #759197;margin:10px auto;max-width:410px;aspect-ratio:1}.tile{position:relative;border:2px solid #0e2430;border-bottom-width:5px;border-radius:2px;display:grid;place-items:center;min-width:0;padding:0;cursor:pointer}.tile svg{width:80%;height:80%;image-rendering:pixelated;shape-rendering:crispEdges}.tile.sel{outline:3px solid #fff0b1;z-index:1}.tile.lock:after{content:'✕';position:absolute;color:#fff1ce;font-size:24px;font-weight:900;text-shadow:2px 2px #4d3928}.statline{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800}.choice{width:100%;text-align:left;background:#203945;border:2px solid #77908e;color:#f9e9c6;padding:12px;margin-top:8px;cursor:pointer}.choice b{display:block}.choice small{color:#bcd0c8}.companion{display:flex;gap:12px;align-items:center;background:#203945;border:2px solid #55727a;padding:9px;margin-top:9px}.portrait{width:60px;height:60px;image-rendering:pixelated;background:#729a9a;flex-shrink:0}.companion .btn{margin-left:auto;font-size:12px;padding:8px}.footer-note{font-size:11px;color:#9bb1b4;margin-top:10px}#error{white-space:pre-wrap;color:#ffb9a7}</style></head><body><div id="app"><header><b>✦ 작은 집, 먼 모험</b><span id="money">◈ 0　★ 0</span></header><main id="screen"></main><nav class="tabs" id="tabs"></nav></div><script>
'use strict';
const $=s=>document.querySelector(s);const safeGet=()=>{try{return JSON.parse(localStorage.getItem('pixel-quest-v2'))||{}}catch(e){return {}}};const save=()=>{try{localStorage.setItem('pixel-quest-v2',JSON.stringify({coins:S.coins,stars:S.stars,stage:S.stage,hero:S.hero,items:S.items,pet:S.pet,flags:S.flags}))}catch(e){}};
const prev=safeGet();const S={coins:prev.coins||0,stars:prev.stars||0,stage:prev.stage||0,hero:prev.hero||0,items:prev.items||[],pet:prev.pet||false,flags:prev.flags||{},page:'map',battle:null,dialog:null};
const heroes=[{name:'리라',role:'숲의 기록자',power:'선택한 타일 하나 제거',color:'#e7b77d',desc:'길을 잃은 기록을 찾고 있습니다.'},{name:'에단',role:'떠돌이 수호자',power:'장애물 2개 제거',color:'#b0c9d0',desc:'돌아갈 곳을 찾고 있습니다.'},{name:'세라',role:'길 위의 상인',power:'남은 이동 +3',color:'#dd9a94',desc:'새로운 풍경을 수집합니다.'}];
const levels=[{name:'이끼 낀 오솔길',goal:10,blocks:0,moves:18,story:'숲 입구에 누군가의 낡은 지도가 떨어져 있습니다.'},{name:'버려진 우물',goal:13,blocks:3,moves:20,story:'우물 속에서 작은 종소리가 들립니다.'},{name:'달빛 버섯 숲',goal:15,blocks:5,moves:23,story:'숲이 깊어질수록 길이 자꾸 달라집니다.'},{name:'오래된 석문',goal:18,blocks:6,moves:25,story:'석문에는 돌아올 사람을 위한 문장이 새겨져 있습니다.'}];
const palette={sky:'#a6c9bf',cloud:'#e4dfbb',mount:'#72999b',hill:'#4b7d77',grass:'#6e985e',grass2:'#8aaa6b',dirt:'#bfa37b',wood:'#825a47',roof:'#a96654',ink:'#2a3740',gold:'#edc875',leaf:'#477b5b',dark:'#263e42'};
const sprites={hero:['..HHHH..','.HSSSH..','..SSSS..','.CCBBC..','.CCBBC..','..PPPP..','..P..P..','..B..B..'],cat:['........','..KKKK..','.KWWWWK.','KWWKWWK.','KWWWWWWK','.KWWWWK.','..K..K..','..K..K..'],tree:['...LL...','..LLLL..','.LLLLLL.','LLLLLLLL','.LLLLLL.','..LWWL..','...WW...','...WW...'],house:['...RRRRRRRR...','..RRRRRRRRRR..','.RRRRRRRRRRRR.','RRRRRRRRRRRRRR','..WWWWWWWWWW..','..WWDDWWDDWW..','..WWDDWWDDWW..','..WWWWWWWWWW..','..WWWWKKWWWW..','..WWWWKKWWWW..'],flower:['...P....','..PPP...','...Y....','...G....','..GGG...','...G....']};
const mapColor={H:'#483f40',S:'#f2c6a0',C:'#597eac',B:'#e7c777',P:'#554b64',K:'#4a3b3e',W:'#e9dfc1',L:'#397d55',R:'#ae6654',D:'#9cc2bc',Y:'#e7d66e',G:'#4c8a5d'};
function spr(ctx,key,x,y,p=3,colors={}){const rows=sprites[key];rows.forEach((row,yy)=>[...row].forEach((c,xx)=>{if(c!=='.'){ctx.fillStyle=colors[c]||mapColor[c]||'#fff';ctx.fillRect(Math.round(x+xx*p),Math.round(y+yy*p),p,p)}}))}
function rect(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}function scene(type){const cv=document.createElement('canvas');cv.width=320;cv.height=200;cv.className='pixel';cv.setAttribute('aria-label',type==='map'?'픽셀 숲길과 모험가':type==='home'?'픽셀 집 내부':'픽셀 모험 장면');const c=cv.getContext('2d');c.imageSmoothingEnabled=false;
if(type==='map'||type==='story'){rect(c,0,0,320,110,palette.sky);rect(c,15,27,53,8,palette.cloud);rect(c,23,20,36,8,palette.cloud);rect(c,204,40,61,8,palette.cloud);rect(c,214,32,42,8,palette.cloud);for(let i=0;i<8;i++){rect(c,i*48-20,86-(i%3)*12,75,44,palette.mount)}rect(c,0,106,320,94,palette.grass);for(let i=0;i<320;i+=20)rect(c,i,125+(i%4)*9,12,4,palette.grass2);rect(c,108,143,105,57,palette.dirt);rect(c,125,116,70,31,palette.dirt);rect(c,145,101,32,18,palette.dirt);spr(c,'tree',13,83,7);spr(c,'tree',263,87,7);spr(c,'tree',229,126,5);spr(c,'flower',76,158,3);spr(c,'flower',249,172,3);spr(c,'hero',150,140,5,{C:heroes[S.hero].color});spr(c,'cat',196,161,3);if(type==='story'){rect(c,11,11,115,23,'#203d46');c.fillStyle='#ffe0a0';c.font='bold 12px sans-serif';c.fillText('CHAPTER '+(S.stage+1),19,27)}}
else {rect(c,0,0,320,200,'#b5aa90');rect(c,0,0,320,94,'#8d9989');for(let x=0;x<320;x+=40)rect(c,x,94,2,106,'#9c8569');rect(c,0,94,320,106,'#ac8d6b');for(let y=105;y<200;y+=23)rect(c,0,y,320,2,'#947457');rect(c,16,19,85,73,'#4a656a');rect(c,23,26,71,59,'#a6c9bf');rect(c,52,26,5,59,'#4a656a');rect(c,23,54,71,5,'#4a656a');rect(c,122,88,76,39,'#80634d');rect(c,132,75,56,15,'#d2bd92');rect(c,135,63,48,13,'#c4a47a');rect(c,235,76,48,66,'#6e594d');rect(c,240,81,38,52,'#b6a280');rect(c,249,101,20,23,'#718b75');spr(c,'hero',45,123,5,{C:heroes[S.hero].color});if(S.items.includes('plant')){spr(c,'tree',212,111,4)}if(S.items.includes('rug')){rect(c,100,161,125,24,'#9d6b6b');rect(c,106,166,113,14,'#d5a18a')}if(S.items.includes('lamp')){rect(c,292,77,6,83,'#554b49');rect(c,277,62,34,19,'#ebcb8e')}if(S.pet)spr(c,'cat',196,145,4);}
return cv}
function base(){ $('#money').textContent=`◈ ${S.coins}　★ ${S.stars}`;$('#tabs').innerHTML=[['map','🗺','모험'],['puzzle','◆','퍼즐'],['friends','♟','동료'],['home','⌂','나의 집']].map(([id,ico,n])=>`<button data-page="${id}" class="${S.page===id?'active':''}"><strong>${ico}</strong>${n}</button>`).join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.page=b.dataset.page;render()})}
function showScene(type){$('#screen').appendChild(scene(type))}function panel(title,html){const el=document.createElement('div');el.className='panel';el.innerHTML=`<div class="eyebrow">${title}</div>${html}`;$('#screen').appendChild(el);return el}
function render(){base();$('#screen').replaceChildren();try{if(S.page==='map')mapPage();if(S.page==='puzzle')puzzlePage();if(S.page==='friends')friendsPage();if(S.page==='home')homePage()}catch(e){console.error(e);$('#screen').innerHTML='<div class="panel" id="error">화면 오류: '+String(e)+'</div>'}}
function mapPage(){showScene('map');const lv=levels[S.stage%levels.length];let p=panel('PIXEL ADVENTURE',`<div class="title">제 ${S.stage+1}장 · ${lv.name}</div><div class="muted">${lv.story}</div><div class="chips"><span class="chip">동행: ${heroes[S.hero].name}</span><span class="chip">퍼즐 ${S.stage+1}단계</span><span class="chip">보상 ◈ ${35+S.stage*5}</span></div><div class="actions"><button class="btn" id="start">모험 떠나기 →</button></div>`);p.querySelector('#start').onclick=()=>{S.page='story';storyPage()};p=panel('여정의 기록',`<div class="muted">숲을 지나 오래된 석문까지. 동료와 함께 퍼즐을 풀고, 얻은 물건으로 작은 집을 채워 보세요.</div>`)}
function storyPage(){S.page='story';base();$('#screen').replaceChildren();showScene('story');const lv=levels[S.stage%levels.length];let p=panel('STORY · 갈림길',`<div class="title">${lv.name}</div><div class="muted">${lv.story}<br><br>${heroes[S.hero].name}: “어느 쪽으로 가볼까요?”</div><button class="choice" id="left"><b>오래된 발자국을 따라간다</b><small>조심스럽게 흔적을 살핀다</small></button><button class="choice" id="right"><b>바람 소리가 나는 쪽으로 간다</b><small>새로운 길을 발견할지도 모른다</small></button>`);p.querySelector('#left').onclick=()=>startBattle('흔적을 따라 숲속으로 들어갑니다.');p.querySelector('#right').onclick=()=>startBattle('나뭇잎 사이로 작은 빛이 보입니다.')}
const colors=['#e9c46a','#77b7bd','#dc8c84','#a9b88a','#b19bc9'];const shapes=['gem','water','berry','leaf','moon'];function tileSvg(k){let paths=[`<path fill="#fff2ae" d="M10 2H22V7H28V20H22V27H10V20H4V7H10Z"/><path fill="#b77b36" d="M10 2H22V7H10ZM4 7H10V20H4Z"/>`,`<path fill="#bde9e5" d="M16 2H20V8H24V14H28V23H23V28H9V23H4V14H8V8H12V2Z"/><path fill="#438ca2" d="M4 14H9V23H14V28H9V23H4Z"/>`,`<path fill="#f4a6a0" d="M9 6H23V10H28V24H23V28H9V24H4V10H9Z"/><path fill="#ad5a65" d="M4 10H9V24H4Z"/><path fill="#5f9b72" d="M12 2H20V7H12Z"/>`,`<path fill="#b5df9a" d="M15 3H22V8H27V17H22V23H15V28H9V22H5V13H10V8H15Z"/><path fill="#4d8864" d="M9 22H15V28H9Z"/>`,`<path fill="#d7c8f3" d="M18 3H25V8H18V13H14V19H18V24H25V28H15V24H10V19H6V12H10V7H15V3Z"/>`];return `<svg viewBox="0 0 32 32" aria-hidden="true">${paths[k]}</svg>`}
function makeBoard(){let b;for(let attempt=0;attempt<300;attempt++){b=Array.from({length:36},()=>Math.floor(Math.random()*5));if(!matches(b).length&&hasMove(b))return b}return b}
function matches(b){let s=new Set();for(let y=0;y<6;y++)for(let x=0;x<6;x++){let i=y*6+x,v=b[i];if(v==null)continue;if(x<4&&b[i+1]===v&&b[i+2]===v){let j=x;while(j<6&&b[y*6+j]===v)s.add(y*6+j++)}if(y<4&&b[i+6]===v&&b[i+12]===v){let j=y;while(j<6&&b[j*6+x]===v)s.add(j++*6+x)}}return [...s]}
function hasMove(b){for(let i=0;i<36;i++)for(const j of [i+1,i+6]){if(j>=36||(j===i+1&&i%6===5))continue;[b[i],b[j]]=[b[j],b[i]];const ok=matches(b).length>0;[b[i],b[j]]=[b[j],b[i]];if(ok)return true}return false}
function startBattle(msg){const lv=levels[S.stage%levels.length];let locks=new Set();while(locks.size<lv.blocks)locks.add(Math.floor(Math.random()*36));S.battle={board:makeBoard(),locks,moves:lv.moves,goal:lv.goal,collected:0,selected:-1,used:false,message:msg};S.page='puzzle';render()}
function ensureBattle(){if(!S.battle)startBattle('모험 지도에서 이야기를 시작할 수도 있습니다.')}
function puzzlePage(){if(!S.battle){let p=panel('MATCH-3 PUZZLE',`<div class="title">모험을 위한 퍼즐</div><div class="muted">인접한 타일을 바꿔 같은 문양 3개 이상을 연결하세요. 나무 상자 표시가 있는 타일도 제거해야 합니다.</div><div class="actions"><button class="btn" id="quick">퍼즐 시작</button></div>`);p.querySelector('#quick').onclick=()=>startBattle('퍼즐에 도전합니다.');return}const B=S.battle;let p=panel('MATCH-3 · '+levels[S.stage%levels.length].name,`<div class="statline"><span>남은 이동 ${B.moves}</span><span>수집 ${B.collected}/${B.goal}</span><span>장애물 ${B.locks.size}</span></div><div class="muted" id="hint">${B.message}</div><div class="board" id="board"></div><div class="actions"><button class="btn secondary" id="skill" ${B.used?'disabled':''}>${heroes[S.hero].name} 능력 ${B.used?'(사용함)':'사용'}</button><button class="btn secondary" id="restart">재시작</button></div>`);const board=p.querySelector('#board');B.board.forEach((v,i)=>{const b=document.createElement('button');b.className='tile'+(B.selected===i?' sel':'')+(B.locks.has(i)?' lock':'');b.style.background=colors[v]||'#4c6770';b.innerHTML=tileSvg(v);b.setAttribute('aria-label',`${i+1}번 타일`);b.onclick=()=>tap(i);board.appendChild(b)});p.querySelector('#skill').onclick=skill;p.querySelector('#restart').onclick=()=>startBattle('새 퍼즐을 시작합니다.');}
function tap(i){const B=S.battle;if(!B)return;if(B.skillTarget){B.skillTarget=false;B.used=true;B.board[i]=null;B.collected++;B.locks.delete(i);fall(B);B.message='리라가 타일 하나를 정리했습니다.';finish();return}if(B.selected<0){B.selected=i;render();return}const a=B.selected;B.selected=-1;if(a===i){render();return}if(Math.abs(a-i)!==6&&!(Math.floor(a/6)===Math.floor(i/6)&&Math.abs(a-i)===1)){B.selected=i;render();return}[B.board[a],B.board[i]]=[B.board[i],B.board[a]];if(!matches(B.board).length){[B.board[a],B.board[i]]=[B.board[i],B.board[a]];B.message='같은 문양 3개를 연결해야 합니다.';render();return}B.moves--;resolve(B);finish()}
function resolve(B){for(let t=0;t<30;t++){const m=matches(B.board);if(!m.length)break;for(const i of m){B.board[i]=null;B.collected++;B.locks.delete(i)}fall(B)}if(!hasMove(B.board))B.board=makeBoard();B.message='좋아요! 계속 연결해 보세요.'}
function fall(B){for(let x=0;x<6;x++){let vals=[];for(let y=5;y>=0;y--){const v=B.board[y*6+x];if(v!=null)vals.push(v)}for(let y=5;y>=0;y--)B.board[y*6+x]=vals[5-y]??Math.floor(Math.random()*5)}}
function skill(){const B=S.battle;if(!B||B.used)return;if(S.hero===0){B.skillTarget=true;B.message='제거할 타일을 하나 선택하세요.';render();return}if(S.hero===1){for(const i of [...B.locks].slice(0,2))B.locks.delete(i);B.message='에단이 장애물을 치웠습니다.'}if(S.hero===2){B.moves+=3;B.message='세라가 이동 기회를 늘렸습니다.'}B.used=true;finish()}
function finish(){const B=S.battle;if(B.collected>=B.goal&&B.locks.size===0){const reward=35+S.stage*5;S.coins+=reward;S.stars++;S.stage++;S.battle=null;save();S.page='win';base();$('#screen').replaceChildren();showScene('map');let p=panel('QUEST COMPLETE',`<div class="title">모험 성공!</div><div class="muted">${heroes[S.hero].name}와 함께 길을 열었습니다.<br>획득 보상: ◈ ${reward} · ★ 1<br>집에 가져갈 이야기가 하나 더 생겼습니다.</div><div class="actions"><button class="btn" id="next">다음 모험</button><button class="btn secondary" id="backhome">집으로</button></div>`);p.querySelector('#next').onclick=()=>{S.page='map';render()};p.querySelector('#backhome').onclick=()=>{S.page='home';render()};return}if(B.moves<=0){S.battle=null;S.page='lose';base();$('#screen').replaceChildren();let p=panel('TRY AGAIN',`<div class="title">조금만 더!</div><div class="muted">이번에는 길을 찾지 못했습니다. 다른 동료를 선택해 다시 도전할 수 있습니다.</div><div class="actions"><button class="btn" id="retry">다시 도전</button><button class="btn secondary" id="friends">동료 변경</button></div>`);p.querySelector('#retry').onclick=()=>startBattle('다시 시작합니다.');p.querySelector('#friends').onclick=()=>{S.page='friends';render()};return}render()}
function friendsPage(){let p=panel('TRAVEL COMPANIONS',`<div class="title">누구와 함께 갈까요?</div><div class="muted">동료마다 퍼즐에서 사용할 수 있는 능력이 다릅니다. 한 모험에 한 명만 동행합니다.</div>`);heroes.forEach((h,i)=>{const el=document.createElement('div');el.className='companion';const cv=document.createElement('canvas');cv.width=64;cv.height=64;cv.className='portrait';const c=cv.getContext('2d');c.imageSmoothingEnabled=false;rect(c,0,0,64,64,'#6f9b99');spr(c,'hero',9,6,6,{C:h.color});el.appendChild(cv);const info=document.createElement('div');info.style.flex='1';info.innerHTML=`<b>${h.name}</b><div class="muted">${h.role}<br>${h.power}<br>${h.desc}</div>`;el.appendChild(info);const btn=document.createElement('button');btn.className='btn';btn.textContent=S.hero===i?'동행 중':'선택';btn.disabled=S.hero===i;btn.onclick=()=>{S.hero=i;S.battle=null;save();render()};el.appendChild(btn);p.appendChild(el)})}
function homePage(){showScene('home');let p=panel('MY LITTLE HOME',`<div class="title">모험이 끝나면 돌아오는 곳</div><div class="muted">모험에서 얻은 동전으로 가구와 반려동물을 모으세요. 집은 이야기의 보상 공간입니다.</div><div class="chips"><span class="chip">가구 ${S.items.length}/3</span><span class="chip">반려동물 ${S.pet?'1':'0'}/1</span></div>`);p=panel('꾸미기 상점',`<div class="muted">획득한 가구는 집 안에 바로 배치됩니다.</div>`);[['rug','따뜻한 러그',30],['plant','초록 화분',45],['lamp','노란 스탠드',55],['pet','고양이 친구',65]].forEach(([id,name,price])=>{let owned=id==='pet'?S.pet:S.items.includes(id);let b=document.createElement('button');b.className='choice';b.innerHTML=`<b>${name}　${owned?'✓ 보유':'◈ '+price}</b><small>${owned?'집에 배치되었습니다':'모험 보상으로 구입'}</small>`;b.disabled=owned;b.style.opacity=owned?.65:1;b.onclick=()=>{if(S.coins<price){alert('동전이 부족합니다. 모험에서 퍼즐을 완료해 보세요.');return}S.coins-=price;if(id==='pet')S.pet=true;else S.items.push(id);save();render()};p.appendChild(b)})}
window.addEventListener('error',e=>{console.error(e.message)});render();
</script></body></html>
